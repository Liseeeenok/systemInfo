# SystemInfo — локейшены приложения (Laravel 13 + Vue 3). Публикуется в /system/.
#
# Файл ставится сниппетом и подключается в серверный блок конфига хоста:
#   include /etc/nginx/snippets/systeminfo.conf;
#
#   sudo cp deploy/nginx-systeminfo.conf /etc/nginx/snippets/systeminfo.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# На хосте должны быть: root /var/www/sites и симлинк
#   /var/www/sites/system -> /var/www/systeminfo/public

location = /system {
    return 301 /system/;
}

# Совместимость: до переезда в /system дашборд жил в корне сайта.
location = /login {
    return 301 /system/login;
}

# PHP — отдельным regex-локейшеном: иначе index.php уходит как статический файл.
location ~ ^/system/(?<system_php>.+\.php)$ {
    root /var/www/sites;
    include fastcgi_params;
    # SCRIPT_NAME задаёт Laravel базу /system -> asset()/route()/url() с префиксом.
    fastcgi_param SCRIPT_FILENAME $document_root/system/$system_php;
    fastcgi_param SCRIPT_NAME /system/$system_php;
    fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    fastcgi_read_timeout 60s;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
}

location /system/ {
    root /var/www/sites;
    index index.php;
    try_files $uri $uri/ /system/index.php?$query_string;
}
