# SystemInfo (Laravel 13 + Vue 3) — legion
# Публикует приложение на 80 (301 -> 443) и 443 (самоподписанный сертификат).
# Устанавливается как /etc/nginx/sites-available/systeminfo -> sites-enabled.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/ssl/legion/legion.crt;
    ssl_certificate_key /etc/ssl/legion/legion.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/systeminfo/public;
    index index.php;

    charset utf-8;
    client_max_body_size 16m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/build/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Nginx-level hardening: no hidden files, no access to app internals.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* /(storage|vendor|database|app|config|routes|tests)/ {
        deny all;
    }

    error_log  /var/log/nginx/systeminfo.error.log;
    access_log /var/log/nginx/systeminfo.access.log;
}
